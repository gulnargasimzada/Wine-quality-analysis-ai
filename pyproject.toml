[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wine-quality-analysis"
version = "0.1.0"
description = "Reproducible Pandas and Polars analysis of merged wine quality data"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "matplotlib==3.11.1",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "polars==1.44.2",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
wine-quality = "wine_quality.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"